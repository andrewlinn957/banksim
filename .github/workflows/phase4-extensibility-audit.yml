name: Phase4 extensibility audit refactor

on:
  push:
    branches: [phase4-capital-markets-bookbuild]
    paths: [.github/workflows/phase4-extensibility-audit.yml]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-capital-markets-bookbuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: python scripts/phase4_extensibility_refactor.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:fast
      - run: npm run test:regression
      - run: git diff --check
      - name: Commit audited architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Align capital markets with product capabilities"
          git push origin HEAD:phase4-capital-markets-bookbuild
