name: Verify contractual accrual robustness

on:
  push:
    branches:
      - fix/contractual-term-deposit-accrual

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contractual-term-deposit-accrual
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/adjust_contractual_accrual.py
      - run: npm ci
      - run: npm run test:fast
      - run: npm run typecheck && npm run build
      - name: Commit verified adjustment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine/simulation.ts
          git commit -m "Bound contractual accrual to funded balance"
          git push
