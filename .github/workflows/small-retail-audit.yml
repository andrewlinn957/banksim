name: Small retail bank balance-sheet audit

on:
  push:
    branches:
      - audit-small-uk-retail-bank

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run src/engine/smallRetailBalanceSheetAudit.test.ts --reporter=verbose
