name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: Test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [fast, regression, calibration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - if: matrix.suite == 'fast'
        name: Audit high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run test:${{ matrix.suite }}
      - if: matrix.suite == 'fast'
        run: npm run typecheck && npm run build
