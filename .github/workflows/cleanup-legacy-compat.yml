name: Cleanup legacy compatibility

on:
  push:
    branches:
      - cleanup/remove-legacy-save-compat

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[cleanup-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-legacy-save-compat
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply current-API test migrations
        run: python3 scripts/cleanup_preflight.py

      - name: Apply compatibility cleanup
        run: python3 scripts/cleanup_legacy_compat.py

      - name: Remove temporary cleanup tooling
        run: rm scripts/cleanup_preflight.py scripts/cleanup_legacy_compat.py .github/workflows/cleanup-legacy-compat.yml

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:fast
      - run: npm run test:regression

      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[cleanup-bot] Remove obsolete save and replay compatibility"
          git push origin HEAD:cleanup/remove-legacy-save-compat
