name: Finalize retail current-account model

on:
  push:
    branches: [clean-retail-current-accounts]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clean-retail-current-accounts
      - name: Final consistency cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/engine/simulation.ts'); s=p.read_text()
          s=s.replace("const RETAIL_DEPOSIT_PRODUCTS: LiabilityProductType[] = [\n  LiabilityProductType.RetailCurrentAccounts,\n  LiabilityProductType.RetailTermDeposits,\n];", "const RETAIL_DEPOSIT_PRODUCTS: LiabilityProductType[] = [\n  LiabilityProductType.RetailCurrentAccounts,\n];")
          p.write_text(s)

          p=Path('src/config/baseConfig.ts'); s=p.read_text()
          s=s.replace("[LiabilityProductType.RetailTermDeposits]: {\n    productType: LiabilityProductType.RetailTermDeposits, hqlaLevel: HQLALevel.None, lcrOutflowRate: 0, nsfrAsfFactor: .95,\n  },", "[LiabilityProductType.RetailTermDeposits]: {\n    productType: LiabilityProductType.RetailTermDeposits, hqlaLevel: HQLALevel.None, lcrOutflowRate: 0, nsfrAsfFactor: .90,\n  },")
          p.write_text(s)

          p=Path('src/engine/prudential.test.ts'); s=p.read_text()
          marker="""  it('uses contractual wholesale maturities at 1, 6 and 12 months', () => {"""
          test="""  it('uses retail runoff inside 30 days and maturity-based NSFR factors for fixed-term savings', () => {\n    const s = cloneBankState(initialState);\n    s.fundingLadders[L.RetailTermDeposits] = [\n      { monthsToMaturity: 1, tenorMonths: 12, notional: 100, rate: .04 },\n      { monthsToMaturity: 12, tenorMonths: 12, notional: 100, rate: .04 },\n    ];\n    line(s,L.RetailTermDeposits).balance=200;\n    const l=prudentialLiquidityLines(s,baseConfig).find(l=>l.productType===L.RetailTermDeposits)!;\n    expect(l.outflow).toBeCloseTo(10);\n    expect(l.asf).toBeCloseTo(190);\n  });\n"""
          if test not in s: s=s.replace(marker,test+marker)
          p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Tighten retail deposit regulatory treatment"
          git push origin HEAD:clean-retail-current-accounts
