name: Apply final corporate calibration

on:
  push:
    branches:
      - rebalance-long-run-dynamics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebalance-long-run-dynamics
          fetch-depth: 0
      - name: Apply calibrated corporate demand parameters
        run: |
          python - <<'PY'
          from pathlib import Path

          config_path = Path('src/config/baseConfig.ts')
          config_text = config_path.read_text()
          old_config = '''    [AssetProductType.CorporateLoans]: {
      baseDemandRateMonthly: 0.05,
      pricingSensitivity: 25,
'''
          new_config = '''    [AssetProductType.CorporateLoans]: {
      baseDemandRateMonthly: 0.026,
      pricingSensitivity: 65,
'''
          if old_config not in config_text:
              raise SystemExit('corporate calibration block not found')
          config_path.write_text(config_text.replace(old_config, new_config, 1))

          regression_path = Path('src/engine/modelRegression.test.ts')
          regression_text = regression_path.read_text()
          old_policy = '  const corporateDiscount = pricing.corporateDiscount ?? 0.006;'
          new_policy = '  const corporateDiscount = pricing.corporateDiscount ?? 0.015;'
          if old_policy not in regression_text:
              raise SystemExit('corporate policy discount marker not found')
          regression_path.write_text(regression_text.replace(old_policy, new_policy, 1))

          for temporary in [
              Path('src/engine/corporateCaptureSweep.test.ts'),
              Path('.github/workflows/agent-apply-final-corporate-calibration.yml'),
          ]:
              if temporary.exists():
                  temporary.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize corporate loan replacement calibration"
          git push origin HEAD:rebalance-long-run-dynamics
