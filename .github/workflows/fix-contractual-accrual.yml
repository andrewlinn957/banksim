name: Fix contractual funding accrual

on:
  push:
    branches:
      - fix/contractual-term-deposit-accrual

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contractual-term-deposit-accrual
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch contractual funding accrual and tests
        run: python .github/scripts/fix_contractual_accrual.py
      - run: npm ci
      - run: npm run test:fast
      - run: npm run typecheck && npm run build
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine/simulation.ts src/engine/fundingLadder.test.ts
          git commit -m "Fix contractual funding interest accrual"
          git push
