name: Fix architecture regressions

on:
  push:
    branches:
      - fix/supervisory-history-tier2-leverage-osii-tests

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supervisory-history-tier2-leverage-osii-tests
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/fix_architecture_regressions.py
      - run: npm ci
      - run: npm run test:fast
      - run: npm run test:regression
      - run: npm run typecheck && npm run build
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git commit -m "Fix supervisory close, Tier 2 boundary and leverage chart"
          git push
