name: Issue 65 run session rebase

on:
  push:
    branches:
      - refactor/issue-65-run-session-main
    paths:
      - .github/workflows/issue65-run-session-main.yml

permissions:
  contents: write

jobs:
  port-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-65-run-session-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
      - run: npm ci
      - name: Port verified run-session files
        run: |
          git fetch origin refactor/issue-65-run-session
          git checkout origin/refactor/issue-65-run-session -- src/App.tsx src/ui/useRunSession.ts src/ui/navigationBehaviour.test.tsx
      - run: npm run test:fast
      - run: npm run test:regression
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/ui/useRunSession.ts src/ui/navigationBehaviour.test.tsx
          git commit -m 'Extract run-history session coordination and cover navigation'
          git push origin HEAD:refactor/issue-65-run-session-main
