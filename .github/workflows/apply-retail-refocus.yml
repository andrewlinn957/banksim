name: Apply retail-bank refocus

on:
  push:
    branches:
      - audit-small-uk-retail-bank
    paths:
      - .github/workflows/apply-retail-refocus.yml
      - .github/scripts/apply_retail_refocus.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-small-uk-retail-bank
      - name: Adapt migration to current engine layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/apply_retail_refocus.py')
          lines=p.read_text().splitlines()
          lines=[line for line in lines if not (
            ('rep(p,' in line and 'annualPd: args.annualPd' in line) or
            ('rep(p,' in line and 'const delta = item.balance * growth' in line) or
            ('rep(p,' in line and 'item.balance = Math.max(0, item.balance + delta)' in line)
          )]
          p.write_text('\n'.join(lines)+'\n')
          PY
      - name: Apply coordinated patch
        run: python .github/scripts/apply_retail_refocus.py
      - name: Finish cohort and contractual-deposit wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/engine/simulation.ts'); t=p.read_text()
          old='''      const desiredDelta = desiredBalance - before;\n      if (desiredDelta >= 0) {\n        item.balance = desiredBalance;\n        adjustCashOrFail(state, desiredDelta, events);'''
          new='''      const rawDesiredDelta = desiredBalance - before;\n      const desiredDelta = meta.behaviour.isTermDeposit ? Math.max(0, rawDesiredDelta) : rawDesiredDelta;\n      if (desiredDelta >= 0) {\n        item.balance = before + desiredDelta;\n        adjustCashOrFail(state, desiredDelta, events);\n        if (meta.behaviour.isTermDeposit && desiredDelta > 0) {\n          const tenor = Math.max(6, state.behaviour.termDepositTenorMonths ?? 12);\n          genericFundingBuckets(state, item.productType).push({ tenorMonths: tenor, monthsToMaturity: tenor, notional: desiredDelta, rate: item.interestRate });\n        }'''
          if old not in t: raise SystemExit('deposit flow target missing')
          p.write_text(t.replace(old,new,1))

          p=Path('src/engine/loanCohorts.ts'); t=p.read_text()
          t=t.replace("const fallbackSectorForProduct = (productType: ProductType): LoanSector =>\n  productType === AssetProductType.Mortgages ? 'retailMortgage' : 'largeCorporate';", "const fallbackSectorForProduct = (productType: ProductType): LoanSector =>\n  productType === AssetProductType.Mortgages ? 'retailMortgage' : productType === AssetProductType.ConsumerLoans ? 'consumer' : 'sme';")
          old='''      annualPd: Math.max(0, args.annualPd),\n      lgd: clamp(args.lgd, 0, 1),\n      affordabilityIndex: 1,'''
          new='''      annualPd: Math.max(0, args.productType === AssetProductType.Mortgages ? args.annualPd * (1 + Math.max(0, (state.behaviour.mortgagePolicy?.maxLtv ?? .85) - .75) * 1.6) : args.annualPd),\n      lgd: args.productType === AssetProductType.Mortgages ? clamp(args.lgd + Math.max(0, (state.behaviour.mortgagePolicy?.maxLtv ?? .85) - .75) * .8, 0, .95) : clamp(args.lgd, 0, 1),\n      ltv: args.productType === AssetProductType.Mortgages ? (state.behaviour.mortgagePolicy?.maxLtv ?? .85) : undefined,\n      fixedPeriodMonths: args.productType === AssetProductType.Mortgages ? (state.behaviour.mortgagePolicy?.fixedPeriodMonths ?? 24) : undefined,\n      affordabilityIndex: 1,'''
          if old not in t: raise SystemExit('cohort constructor target missing')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "andrewlinn957"
          git config user.email "139116101+andrewlinn957@users.noreply.github.com"
          git add src .github/scripts/.retail_refocus_applied
          git commit -m "Implement small UK retail-bank balance sheet mechanics"
          git push origin HEAD:audit-small-uk-retail-bank
