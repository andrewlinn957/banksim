name: Apply control decluttering patch

on:
  push:
    branches:
      - rebalance-long-run-dynamics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebalance-long-run-dynamics
          fetch-depth: 0
      - name: Simplify player controls
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          replacements = [
            ("    'corporateLoanRate',\n    'hedgeFixedRate',\n", "    'corporateLoanRate',\n"),
            ("  if (state.hedgeDirection !== 'none') {\n    if ((values.hedgeNotional ?? 0) <= 0) {\n      errors.hedgeNotional = 'Hedge notional must be greater than zero';\n    }\n    if (values.hedgeFixedRate === undefined) {\n      errors.hedgeFixedRate = 'Provide a fixed rate for hedge entry';\n    }\n  }\n", "  if (state.hedgeDirection !== 'none' && (values.hedgeNotional ?? 0) <= 0) {\n    errors.hedgeNotional = 'Hedge notional must be greater than zero';\n  }\n"),
            ("    at1CouponMode: formState.at1CouponMode,\n", "    at1CouponMode: 'auto',\n"),
            ("    values.hedgeNotional > 0 &&\n    values.hedgeFixedRate !== undefined\n", "    values.hedgeNotional > 0\n"),
            ("      fixedRate: values.hedgeFixedRate,\n", "      fixedRate: currentState.market.riskFreeShort,\n"),
            ("      at1CouponMode: 'pay',\n", "      at1CouponMode: 'auto',\n"),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Expected App.tsx snippet missing: {old[:100]!r}')
            text = text.replace(old, new, 1)
          path.write_text(text)

          Path('.github/workflows/agent-declutter-controls.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Derive automatic AT1 and swap execution details"
          git push origin HEAD:rebalance-long-run-dynamics
