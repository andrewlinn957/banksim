name: Audit soft-state references

on:
  push:
    branches:
      - cleanup/remove-low-value-soft-state

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List soft-state references
        shell: bash
        run: |
          echo '=== conduct / reputation ==='
          git grep -n -E 'conductRisk|ConductRisk|conductEvent|conductCosts|reputation|reputationRunoffSensitivity|internalTargetConductSensitivity' -- ':!package-lock.json' || true
          echo '=== board pressure ==='
          git grep -n -E 'boardPressure|BoardPressure|earningsVolatility|previousNetIncome|internalTargetVolatilitySensitivity|earningsVolatilityTolerance' -- ':!package-lock.json' || true
