name: Fix ITL1 UI

on:
  push:
    branches: [feature/itl1-rwa-map]
    paths:
      - '.github/workflows/fix-itl1-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/itl1-rwa-map
      - run: python scripts/fix_itl1_ui.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use ITL1 labels in loan portfolio UI"
          git push origin HEAD:feature/itl1-rwa-map
