name: Apply cohort compaction
on:
  push:
    branches: [rebalance-long-run-dynamics]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebalance-long-run-dynamics
          fetch-depth: 0
      - name: Patch cohort engine
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit compaction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compact renewal and workout cohort state"
          git push origin HEAD:rebalance-long-run-dynamics
