name: Fix unused funding line

on:
  push:
    branches: [audit-small-uk-retail-bank]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-small-uk-retail-bank
      - name: Patch funding line creation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/engine/simulation.ts')
          s=p.read_text()
          old='''const syncFundingLineFromLadder = (\n  state: BankState,\n  config: SimulationConfig,\n  productType: FundingProduct\n): void => {\n  const buckets = getFundingLadderBuckets(state, productType);\n  const line = ensureLineItem(\n    state,\n    BalanceSheetSide.Liability,\n    productType,'''
          new='''const syncFundingLineFromLadder = (\n  state: BankState,\n  config: SimulationConfig,\n  productType: FundingProduct\n): void => {\n  const buckets = getFundingLadderBuckets(state, productType);\n  const existingLine = findItem(state.financial.balanceSheet, productType);\n  // Do not manufacture dormant wholesale products merely because the lifecycle loop knows about them.\n  // Legacy saved games with an existing line, or products with real maturity buckets, still work normally.\n  if (!existingLine && buckets.length === 0) return;\n  const line = existingLine ?? ensureLineItem(\n    state,\n    BalanceSheetSide.Liability,\n    productType,'''
          if old not in s: raise SystemExit('syncFundingLineFromLadder pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/simulation.ts
          git commit -m "Stop creating unused short-term wholesale funding"
          git push origin HEAD:audit-small-uk-retail-bank
