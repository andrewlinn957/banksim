name: Fix browser findings

on:
  push:
    branches:
      - audit-small-uk-retail-bank
    paths:
      - .github/scripts/fix_browser_findings.py
      - .github/workflows/fix-browser-findings.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-small-uk-retail-bank
      - run: python .github/scripts/fix_browser_findings.py
      - run: |
          git config user.name "andrewlinn957"
          git config user.email "139116101+andrewlinn957@users.noreply.github.com"
          git add src
          git commit -m "Fix one-off transaction clearing and funding-line clutter"
          git push origin HEAD:audit-small-uk-retail-bank
