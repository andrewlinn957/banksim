# Temporary workflow used only to publish the already verified source patch.
name: Apply review recommendations

on:
  push:
    branches: [improve/review-2026-09-12]
    paths:
      - .github/review-implementation.py
      - .github/workflows/review-implementation.yml

permissions:
  contents: write

jobs:
  publish-verified-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/review-2026-09-12
      - name: Apply verified recommendations
        run: python .github/review-implementation.py
      - name: Exclude workflow edits from Actions commit
        run: git checkout HEAD -- .github/workflows/ci.yml .github/workflows/deploy.yml .github/workflows/review-implementation.yml
      - name: Commit verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/review-implementation.py
          git add src
          git commit -m 'Implement BankSim review recommendations'
          git push origin HEAD:improve/review-2026-09-12
