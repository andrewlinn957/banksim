name: Clean retail current-account model

on:
  push:
    branches: [clean-retail-current-accounts]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clean-retail-current-accounts
      - name: Refactor retail deposits
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)

          p='src/config/scenarios.ts'; s=read(p)
          s=s.replace("            { productType: LiabilityProductType.RetailTransactionalDeposits, balance: 3.5e9 },\n            { productType: LiabilityProductType.RetailSavingsDeposits, balance: 4.5e9 },", "            { productType: LiabilityProductType.RetailSavingsDeposits, balance: 8.0e9 },")
          write(p,s)

          p='src/engine/metrics.ts'; s=read(p)
          s=s.replace("      case LiabilityProductType.RetailTransactionalDeposits: return .35;\n      case LiabilityProductType.RetailSavingsDeposits: return .45;", "      case LiabilityProductType.RetailSavingsDeposits: return .35;")
          write(p,s)

          for p in ['src/engine/initialStepSanity.test.ts','src/engine/simulationTestSuite.ts','src/components/RiskDashboard.tsx']:
              s=read(p).replace('  LiabilityProductType.RetailTransactionalDeposits,\n','')
              write(p,s)

          p='src/components/LcrDashboard.tsx'; s=read(p).replace(',L.RetailTransactionalDeposits',''); write(p,s)
          p='src/App.tsx'; s=read(p)
          s=s.replace('[LiabilityProductType.RetailTransactionalDeposits, LiabilityProductType.RetailSavingsDeposits]', '[LiabilityProductType.RetailSavingsDeposits]')
          write(p,s)

          action_pattern = re.compile(r"\n\s*\{\n\s*type: 'adjustRate',\n\s*productType: LiabilityProductType\.RetailTransactionalDeposits,\n\s*newRate: [^\n]+,\n\s*\},")
          for p in ['src/engine/competitorReaction.test.ts','src/engine/conductRisk.test.ts','src/engine/depositFranchiseDynamics.test.ts','src/engine/modelRegression.test.ts']:
              s=read(p); s=action_pattern.sub('',s); write(p,s)

          p='src/engine/depositFranchiseDynamics.test.ts'; s=read(p).replace('        LiabilityProductType.RetailTransactionalDeposits,\n',''); write(p,s)
          p='src/engine/modelRegression.test.ts'; s=read(p).replace('  productBalance(state, LiabilityProductType.RetailTransactionalDeposits) +\n',''); write(p,s)
          p='src/engine/smallRetailBank.test.ts'; s=read(p)
          s=re.sub(r"\n    expect\((?:initialState|out)\.financial\.balanceSheet\.items\.some\(i => i\.productType === L\.RetailTransactionalDeposits\)\)\.toBe\(false\);",'',s); write(p,s)

          p='src/engine/simulation.ts'; s=read(p)
          s=s.replace('  LiabilityProductType.RetailTransactionalDeposits,\n','')
          s=s.replace("    {\n      name: 'retail',\n      stable: LiabilityProductType.RetailSavingsDeposits,\n      unstable: LiabilityProductType.RetailTransactionalDeposits,\n      competitorRate: state.market.competitorRetailDepositRate,\n    },\n",'')
          s=s.replace("      const competitor = item.productType === LiabilityProductType.RetailTransactionalDeposits\n        ? item.interestRate\n        : meta.behaviour.isTermDeposit\n          ? state.market.competitorTermDepositRate\n          : meta.behaviour.depositSegment === 'corporate'\n            ? state.market.competitorCorporateDepositRate ?? state.market.competitorRetailDepositRate\n            : state.market.competitorRetailDepositRate;", "      const competitor = meta.behaviour.isTermDeposit\n        ? state.market.competitorTermDepositRate\n        : meta.behaviour.depositSegment === 'corporate'\n          ? state.market.competitorCorporateDepositRate ?? state.market.competitorRetailDepositRate\n          : state.market.competitorRetailDepositRate;")
          write(p,s)

          p='src/domain/enums.ts'; s=read(p).replace("  RetailTransactionalDeposits = 'RetailTransactionalDeposits',\n",''); write(p,s)
          p='src/domain/productMeta.ts'; s=read(p); s=re.sub(r"\n  \[LiabilityProductType\.RetailTransactionalDeposits\]: \{[^\n]+\},",'',s); write(p,s)
          p='src/config/baseConfig.ts'; s=read(p)
          for indent in ['  ','  ','    ']:
              pattern = rf"\n{indent}\[LiabilityProductType\.RetailTransactionalDeposits\]: \{{\n(?:.*\n)*?{indent}\}},\n{indent}\[LiabilityProductType\.RetailSavingsDeposits\]"
              s=re.sub(pattern,f"\n{indent}[LiabilityProductType.RetailSavingsDeposits]",s,count=1)
          write(p,s)

          replacements = [
              ('RetailSavingsDeposits','RetailCurrentAccounts'),
              ('competitorRetailDepositRate','competitorRetailCurrentAccountRate'),
              ('competitorDepositReactionSpeed','competitorRetailCurrentAccountReactionSpeed'),
              ('retailDepositRate','retailCurrentAccountRate'),
              ('Instant retail offer','Retail current account rate'),
              ('Instant retail','Retail current accounts'),
              ('instant retail','retail current accounts'),
              ('instant-retail','retail-current-account'),
          ]
          targets=[p for p in Path('src').rglob('*') if p.is_file() and p.suffix in {'.ts','.tsx'}]
          targets += [p for p in [Path('README.md'),Path('player_guide.md')] if p.exists()]
          targets += list(Path('docs').rglob('*.md'))
          for path in targets:
              text=path.read_text()
              for old,new in replacements: text=text.replace(old,new)
              path.write_text(text)

          p='src/config/baseConfig.ts'; s=read(p)
          s=s.replace('volumeElasticityToRate: 0.4642857142857143,','volumeElasticityToRate: 0.25,',1)
          s=s.replace('lcrOutflowRate: 0.08571428571428572,\n    nsfrAsfFactor: 0.9142857142857143,','lcrOutflowRate: 0.10,\n    nsfrAsfFactor: 0.90,',1)
          s=re.sub(r"    \[LiabilityProductType\.RetailCurrentAccounts\]: \{\n      // Blended Retail current accounts assumptions from the former 2/7 transactional \+ 5/7 savings mix\.\n(?:.*\n)*?    \},", """    [LiabilityProductType.RetailCurrentAccounts]: {\n      baselineGrowthMonthly: 0.002,\n      baseChurnMonthly: 0.0035,\n      policyRateBeta: 0.02,\n      competitorSensitivity: 0.45,\n      passThroughLag: 0.45,\n      underpricingConvexity: 20,\n      underpricingDurationSensitivity: 0.08,\n      franchiseDecayRate: 0.5,\n      franchiseRecoveryRate: 0.04,\n      reacquisitionDrag: 0.35,\n      stabilityDecayRate: 0.5,\n      stabilityRecoveryRate: 0.06,\n      mixMigrationRate: 0,\n      mixMigrationDurationSensitivity: 0,\n    },""",s,count=1)
          write(p,s)

          p='src/config/initialState.ts'; s=read(p)
          s=s.replace("'Retail current accounts', 7.0e9, 0.016785714285714286", "'Retail current accounts', 7.0e9, 0.017")
          s=s.replace('[LiabilityProductType.RetailCurrentAccounts]: 0.016785714285714286,','[LiabilityProductType.RetailCurrentAccounts]: 0.017,')
          s=s.replace('[LiabilityProductType.RetailCurrentAccounts]: 1.0760714285714286,','[LiabilityProductType.RetailCurrentAccounts]: 1.0,')
          write(p,s)

          p='src/engine/prudential.ts'; s=read(p)
          marker='// 2026 UK standardised portfolio assumptions: docs/model-basis.md.\n'
          helper="""\nconst clamp01 = (v: number): number => Math.max(0, Math.min(1, v));\n\nexport const retailCurrentAccountRegulatoryFactors = (s: BankState) => {\n  const stableShare = clamp01(s.behaviour.insuredRetailDepositShare ?? 0);\n  const otherShare = 1 - stableShare;\n  return {\n    stableShare,\n    otherShare,\n    lcrOutflowFactor: stableShare * 0.05 + otherShare * 0.10,\n    nsfrAsfFactor: stableShare * 0.95 + otherShare * 0.90,\n  };\n};\n"""
          s=s.replace(marker,marker+helper,1)
          needle='  let rsf = asset ? b * (tag?.nsfrRsfFactor ?? 0) : 0;\n'
          s=s.replace(needle,needle+"  if (p === LiabilityProductType.RetailCurrentAccounts) {\n    const retail = retailCurrentAccountRegulatoryFactors(s);\n    outflow = b * retail.lcrOutflowFactor;\n    asf = b * retail.nsfrAsfFactor;\n  }\n",1)
          old="""      outflow = buckets.reduce((sum, f) => sum + (f.monthsToMaturity <= 1 ? f.notional * (1 + f.rate / 12) : 0), 0);\n      asf = buckets.reduce((sum, f) => {\n        if (p === LiabilityProductType.RetailTermDeposits) return sum + f.notional * (f.monthsToMaturity >= 12 ? 1 : .95);\n        return sum + f.notional * (f.monthsToMaturity >= 12 ? 1 : f.monthsToMaturity >= 6 ? .5 : 0);\n      }, 0);"""
          new="""      outflow = buckets.reduce((sum, f) => {\n        if (f.monthsToMaturity > 1) return sum;\n        if (p === LiabilityProductType.RetailTermDeposits) return sum + f.notional * 0.10;\n        return sum + f.notional * (1 + f.rate / 12);\n      }, 0);\n      asf = buckets.reduce((sum, f) => {\n        if (p === LiabilityProductType.RetailTermDeposits) return sum + f.notional * (f.monthsToMaturity >= 12 ? 1 : 0.90);\n        return sum + f.notional * (f.monthsToMaturity >= 12 ? 1 : f.monthsToMaturity >= 6 ? .5 : 0);\n      }, 0);"""
          if old not in s: raise SystemExit('prudential term-funding block not found')
          s=s.replace(old,new,1); write(p,s)

          p='src/engine/depositSegmentation.test.ts'; s=read(p)
          s=re.sub(r"\n  it\('retail segments react differently to the same pricing change', \(\) => \{.*?\n  \}\);\n",'\n',s,flags=re.S); write(p,s)

          p='src/engine/prudential.test.ts'; s=read(p)
          s=s.replace("import { centralBankExclusion, commitmentLiquidity, prudentialLiquidityLines } from './prudential';", "import { centralBankExclusion, commitmentLiquidity, prudentialLiquidityLines, retailCurrentAccountRegulatoryFactors } from './prudential';")
          s=re.sub(r"  it\('uses (?:instant-retail|retail-current-account|retail/corporate) and corporate liquidity factors independently of reputation', \(\) => \{.*?\n  \}\);", """  it('classifies retail current accounts explicitly for LCR and NSFR', () => {\n    const factors = retailCurrentAccountRegulatoryFactors(initialState);\n    expect(factors.stableShare).toBeCloseTo(0.9);\n    expect(factors.otherShare).toBeCloseTo(0.1);\n    expect(factors.lcrOutflowFactor).toBeCloseTo(0.055);\n    expect(factors.nsfrAsfFactor).toBeCloseTo(0.945);\n    const lines = prudentialLiquidityLines(initialState, baseConfig);\n    const retail = lines.find(x => x.productType === L.RetailCurrentAccounts)!;\n    expect(retail.outflow / retail.balance).toBeCloseTo(0.055);\n    expect(retail.asf / retail.balance).toBeCloseTo(0.945);\n    const operating = lines.find(x => x.productType === L.CorporateOperatingDeposits)!;\n    const otherBusiness = lines.find(x => x.productType === L.CorporateNonOperatingDeposits)!;\n    expect(operating.outflow / operating.balance).toBeCloseTo(0.25);\n    expect(operating.asf / operating.balance).toBeCloseTo(0.5);\n    expect(otherBusiness.outflow / otherBusiness.balance).toBeCloseTo(0.4);\n    expect(otherBusiness.asf / otherBusiness.balance).toBeCloseTo(0.5);\n  });""",s,count=1,flags=re.S)
          s=s.replace('line(s,L.RetailTransactionalDeposits).balance=100;','line(s,L.RetailCurrentAccounts).balance=100;')
          write(p,s)

          p='src/engine/smallRetailBank.test.ts'; s=read(p).replace('toBeCloseTo(0.0167857143, 8)','toBeCloseTo(0.017, 8)'); write(p,s)
          p='src/content/mechanicsRegistry.ts'; s=read(p)
          s=s.replace("'For LCR and NSFR, retail balances are split between stable and other retail deposits. Stable balances receive the lower runoff and higher ASF factors.',", "'For LCR and NSFR, FSCS-covered retail current-account balances are treated as stable retail deposits. The uncovered share is treated as other retail deposits.'")
          write(p,s)
          p='src/components/ActionsPanel.tsx'; s=read(p).replace('Main retail current accounts funding price.','Interest rate paid on retail current-account balances.'); write(p,s)

          forbidden=['RetailTransactionalDeposits','RetailSavingsDeposits','Instant retail','instant retail','competitorRetailDepositRate','retailDepositRate','0.016785714285714286','0.08571428571428572','0.9142857142857143','1.0760714285714286']
          offenders=[]
          for path in Path('src').rglob('*'):
              if not path.is_file() or path.suffix not in {'.ts','.tsx'}: continue
              text=path.read_text()
              for token in forbidden:
                  if token in text: offenders.append(f'{path}: {token}')
          if offenders: raise SystemExit('Stale retail-deposit compatibility/blended assumptions remain:\n'+'\n'.join(offenders))
          PY

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src README.md docs player_guide.md
          git commit -m "Model retail current accounts explicitly"
          git push origin HEAD:clean-retail-current-accounts
