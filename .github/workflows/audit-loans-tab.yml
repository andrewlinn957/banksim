name: Audit loans tab

on:
  push:
    branches:
      - audit-loans-tab
    paths:
      - .github/scripts/audit_loans_tab.py
      - .github/workflows/audit-loans-tab.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-loans-tab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply loans audit fixes
        run: python .github/scripts/audit_loans_tab.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Correct loans tab data and labels"
          git push origin HEAD:audit-loans-tab
