    expect(execution?.executedAmount).toBeCloseTo(100e6, 2);
    expect(purchased).toBeDefined();
    expect(purchased?.notional).toBeCloseTo(execution!.executedAmount, 2);
    expect(purchased?.rate).toBeCloseTo(expectedYield, 10);
