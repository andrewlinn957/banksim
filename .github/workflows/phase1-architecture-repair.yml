name: Phase1 repair

on:
  push:
    branches:
      - phase1-passive-bank-calibration
    paths:
      - ".github/workflows/phase1-architecture-repair.yml"
      - "scripts/phase1_architecture_repair.py"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-passive-bank-calibration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Apply refactor
        run: python scripts/phase1_architecture_repair.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Fast tests
        run: npm run test:fast
      - name: Regression tests
        run: npm run test:regression
      - name: Diff check
        run: git diff --check
      - name: Commit repaired Phase 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor treasury lifecycle into core engine"
          git push origin HEAD:phase1-passive-bank-calibration
