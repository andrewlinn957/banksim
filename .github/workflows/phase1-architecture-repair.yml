name: Phase 1 architecture repair

on:
  push:
    branches: [phase1-passive-bank-calibration]
    paths: [.github/workflows/phase1-architecture-repair.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-passive-bank-calibration
          fetch-depth: 0
