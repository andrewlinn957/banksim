              p.write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one match, found {count}: {old[:80]!r}')
              write(path, text.replace(old, new, 1))

          def regex_replace_once(path, pattern, replacement):
              text = read(path)
              new, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one regex match, found {count}: {pattern[:80]!r}')
