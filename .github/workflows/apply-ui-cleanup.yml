name: Apply UI cleanup

on:
  push:
    branches:
      - ui-risk-dashboard-cleanup
    paths:
      - .github/scripts/apply_ui_cleanup.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-risk-dashboard-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source patch
        run: python .github/scripts/apply_ui_cleanup.py
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Clean up risk and regulatory UI"
          git push origin HEAD:ui-risk-dashboard-cleanup
