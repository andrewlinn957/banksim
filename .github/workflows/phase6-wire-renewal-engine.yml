name: Phase6 wire renewal engine

on:
  push:
    branches: [phase6-three-year-plan-renewal]
    paths: [.github/workflows/phase6-wire-renewal-engine.yml]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-three-year-plan-renewal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Wire renewal action into authoritative simulation dispatcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/engine/simulation.ts')
          s = p.read_text()
          old = "  LaunchCapitalMarketsTransactionAction,\n  DrawBoeFundingAction,"
          new = "  LaunchCapitalMarketsTransactionAction,\n  RenewThreeYearPlanAction,\n  DrawBoeFundingAction,"
          assert old in s, 'action import anchor changed'
          s = s.replace(old, new, 1)
          old = "import { reviewThreeYearPlan } from './threeYearPlan';"
          new = "import { reviewThreeYearPlan } from './threeYearPlan';\nimport { renewThreeYearPlanState } from '../domain/threeYearPlan';"
          assert old in s, 'plan import anchor changed'
          s = s.replace(old, new, 1)
          anchor = "  drawBoeFunding: (action: DrawBoeFundingAction, ctx) => { applyBoeFunding(ctx.state,ctx.config,action.facility,action.amount,ctx.events); },"
          handler = """  renewThreeYearPlan: (action: RenewThreeYearPlanAction, ctx) => {
            const plan = ctx.state.threeYearPlan;
            if (!resolveFeatureFlags(ctx.config).threeYearPlan || !plan?.enabled || !plan.completed || !plan.currentEvaluation) {
              ctx.events.push(createEvent('warning', 'Three-Year Plan renewal requires a completed active plan.'));
              return;
            }
            const weightTotal = action.targets.reduce((sum, target) => sum + Math.max(0, target.weight), 0);
            const milestonesValid = action.targets.every(target =>
              target.milestones.length === 3 &&
              target.milestones.map(milestone => milestone.month).join(',') === '12,24,36' &&
              target.milestones.every(milestone => Number.isFinite(milestone.lower) && (milestone.upper === undefined || Number.isFinite(milestone.upper)))
            );
            const metricsValid = action.targets.length > 0 && action.targets.every(target =>
              bankThreeYearPlanMetricRegistry.has(target.metricId) && Number.isFinite(target.weight) && target.weight >= 0
            );
            if (!(weightTotal > 0) || !milestonesValid || !metricsValid) {
              ctx.events.push(createEvent('warning', 'Three-Year Plan renewal rejected: targets and weights are invalid.'));
              return;
            }
            ctx.state.threeYearPlan = renewThreeYearPlanState({
              completedPlan: plan,
              startStep: ctx.state.time.step,
              targets: action.targets,
            });
            ctx.events.push(createEvent(
              'info',
              `Three-Year Plan Cycle ${ctx.state.threeYearPlan.cycleNumber ?? 2} agreed. Board Confidence carried forward at ${(ctx.state.threeYearPlan.boardConfidence ?? 70).toFixed(0)}/100.`
            ));
          },
"""
          assert anchor in s, 'renewal handler insertion anchor changed'
          s = s.replace(anchor, handler + anchor, 1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check
      - name: Commit engine wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/simulation.ts
          git commit -m "Handle replayable Three-Year Plan renewal"
          git push origin HEAD:phase6-three-year-plan-renewal
