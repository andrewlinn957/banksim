name: Functional navigation refactor

on:
  push:
    branches:
      - feature/functional-navigation

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/functional-navigation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply functional navigation refactor
        run: python scripts/refactor_functional_navigation.py
      - name: Install dependencies
        run: npm ci
      - name: Fast tests
        run: npm run test:fast
      - name: Typecheck and build
        run: npm run typecheck && npm run build
      - name: Regression tests
        run: npm run test:regression
      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/functional-navigation-refactor.yml scripts/refactor_functional_navigation.py
          git add -A
          git commit -m "Reorganize UI around bank functions"
          git push origin HEAD:feature/functional-navigation
