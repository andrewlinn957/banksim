name: PR5 loan selector migration

on:
  push:
    branches:
      - refactor/config-ui-cleanup

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/config-ui-cleanup
          fetch-depth: 0
      - name: Make the loan selector fully capability-driven
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/LoansPanel.tsx')
          text = path.read_text()

          old_helpers = """const getDefaultPortfolio = (
            items: readonly BalanceSheetItem[],
            loanCohorts: Partial<Record<ProductType, LoanCohort[]>> | undefined
          ): LoanPortfolioType => {
            if (hasPortfolioData(items, loanCohorts, AssetProductType.Mortgages)) return AssetProductType.Mortgages;
            if (hasPortfolioData(items, loanCohorts, AssetProductType.ConsumerLoans)) return AssetProductType.ConsumerLoans;
            if (hasPortfolioData(items, loanCohorts, AssetProductType.CorporateLoans)) return AssetProductType.CorporateLoans;
            return AssetProductType.Mortgages;
          };

          const isLoanPortfolioItem = (
            item: BalanceSheetItem
          ): item is BalanceSheetItem & { productType: LoanPortfolioType } =>
            item.productType === AssetProductType.Mortgages || item.productType === AssetProductType.ConsumerLoans || item.productType === AssetProductType.CorporateLoans;"""
          new_helpers = """const getDefaultPortfolio = (
            items: readonly BalanceSheetItem[],
            loanCohorts: Partial<Record<ProductType, LoanCohort[]>> | undefined
          ): LoanPortfolioType => {
            const available = LOAN_PORTFOLIOS.find((portfolio) => hasPortfolioData(items, loanCohorts, portfolio));
            const fallback = LOAN_PORTFOLIOS[0];
            if (!fallback) throw new Error('Product catalogue has no loan-capable products');
            return available ?? fallback;
          };

          const isLoanPortfolioItem = (
            item: BalanceSheetItem
          ): item is BalanceSheetItem & { productType: LoanPortfolioType } =>
            LOAN_PORTFOLIOS.includes(item.productType as LoanPortfolioType);"""
          if old_helpers not in text:
              raise SystemExit('Loan default/type-guard block not found')
          text = text.replace(old_helpers, new_helpers)

          new_availability = """  const selectedPortfolioAvailable = useMemo(
            () => hasPortfolioData(items, loanCohorts, selectedPortfolio),
            [items, loanCohorts, selectedPortfolio]
          );

          useEffect(() => {
            if (selectedPortfolioAvailable) return;
            setSelectedPortfolio(getDefaultPortfolio(items, loanCohorts));
          }, [items, loanCohorts, selectedPortfolioAvailable]);"""
          availability_pattern = re.compile(
              r"  const mortgagesAvailable = useMemo\([\s\S]*?\n  \}, \[consumerAvailable, corporateAvailable, items, loanCohorts, mortgagesAvailable, selectedPortfolio\]\);"
          )
          text, availability_count = availability_pattern.subn(new_availability, text, count=1)
          if availability_count != 1:
              raise SystemExit(f'Expected one loan availability block, migrated {availability_count}')

          new_buttons = """          {LOAN_PORTFOLIOS.map((productType) => (
            <button
              key={productType}
              type=\"button\"
              className={`tab-button ${selectedPortfolio === productType ? 'active' : ''}`}
              onClick={() => setSelectedPortfolio(productType)}
              role=\"tab\"
              aria-selected={selectedPortfolio === productType}
              disabled={!hasPortfolioData(items, loanCohorts, productType)}
            >
              {getProduct(productType).label}
            </button>
          ))}"""
          tabs_pattern = re.compile(
              r'(<div className="tabs" role="tablist" aria-label="Loan portfolio selector">\n)[\s\S]*?(\n        </div>)'
          )
          text, tabs_count = tabs_pattern.subn(lambda m: m.group(1) + new_buttons + m.group(2), text, count=1)
          if tabs_count != 1:
              raise SystemExit(f'Expected one loan selector tablist, migrated {tabs_count}')

          if any(name in text for name in ['mortgagesAvailable', 'consumerAvailable', 'corporateAvailable']):
              raise SystemExit('Hard-coded loan availability variables remain')
          path.write_text(text)
          PY
      - name: Remove temporary migration workflow and commit
        run: |
          rm .github/workflows/pr5-loan-ui-migrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LoansPanel.tsx .github/workflows/pr5-loan-ui-migrate.yml
          git commit -m "Make loan selector capability-driven"
          git push origin HEAD:refactor/config-ui-cleanup
