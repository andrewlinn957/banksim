name: Issue 65 run session

on:
  push:
    branches:
      - refactor/issue-65-run-session
    paths:
      - scripts/issue65_run_session.py
      - .github/workflows/issue65-run-session.yml

permissions:
  contents: write

jobs:
  refactor-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-65-run-session
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
      - run: npm ci
      - run: python scripts/issue65_run_session.py
      - run: npm run test:fast
      - run: npm run test:regression
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'Extract run-history session coordination'
          git push origin HEAD:refactor/issue-65-run-session
