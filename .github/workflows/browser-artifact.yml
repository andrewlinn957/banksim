name: Browser playthrough artifact

on:
  push:
    branches:
      - audit-small-uk-retail-bank
    paths:
      - .github/workflows/browser-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-small-uk-retail-bank
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: banksim-retail-dist
          path: dist

# Temporary workflow used only to validate the exact production bundle before PR merge.
