name: Instant retail refactor

on:
  push:
    branches: [consolidate-instant-retail]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidate-instant-retail
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply product consolidation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/config/initialState.ts')
          s = p.read_text()
          old = """    makeItem(BalanceSheetSide.Liability, LiabilityProductType.RetailTransactionalDeposits, 'Retail Current Accounts', 2.0e9, 0.005, MaturityBucket.LessThan1Y),\n    makeItem(BalanceSheetSide.Liability, LiabilityProductType.RetailSavingsDeposits, 'Instant-Access Savings', 5.0e9, 0.0215, MaturityBucket.LessThan1Y),"""
          new = """    makeItem(BalanceSheetSide.Liability, LiabilityProductType.RetailSavingsDeposits, 'Instant retail', 7.0e9, 0.0215, MaturityBucket.LessThan1Y),"""
          if old not in s:
              raise SystemExit('opening retail deposit block not found')
          s = s.replace(old, new)
          for line in [
              "    [LiabilityProductType.RetailTransactionalDeposits]: 0.007,\n",
              "    [LiabilityProductType.RetailTransactionalDeposits]: 0,\n",
              "    [LiabilityProductType.RetailTransactionalDeposits]: 1.035,\n",
          ]:
              s = s.replace(line, '')
          p.write_text(s)

          # Rename the live product consistently in code, tests and documentation.
          replacements = [
              ('Instant-Access Savings', 'Instant retail'),
              ('Instant-access savings', 'Instant retail'),
              ('instant-access savings', 'instant retail'),
              ('Instant access savings', 'Instant retail'),
              ('instant access savings', 'instant retail'),
          ]
          for root in [Path('src'), Path('docs')]:
              for f in root.rglob('*'):
                  if f.suffix not in {'.ts', '.tsx', '.md'}:
                      continue
                  text = f.read_text()
                  updated = text
                  for a, b in replacements:
                      updated = updated.replace(a, b)
                  updated = updated.replace(
                      'Main retail funding price. Current accounts remain separately modelled and less rate-sensitive.',
                      'Main instant retail funding price.'
                  )
                  if updated != text:
                      f.write_text(updated)

          for f in [Path('README.md'), Path('player_guide.md'), Path('mechanics_exposure_plan.md'), Path('BankSim Notes.md')]:
              if not f.exists():
                  continue
              text = f.read_text()
              updated = text
              for a, b in replacements:
                  updated = updated.replace(a, b)
              updated = updated.replace('- retail current accounts\n- instant retail\n', '- instant retail\n')
              if updated != text:
                  f.write_text(updated)

          # Product metadata remains compatible with old saves, but the active retail product has the new name.
          pm = Path('src/domain/productMeta.ts')
          text = pm.read_text().replace("label: 'Instant retail'", "label: 'Instant retail'")
          pm.write_text(text)

          # Add a regression that the default and ordinary next close do not contain current accounts.
          test = Path('src/engine/smallRetailBank.test.ts')
          t = test.read_text()
          needle = """    expect(initialState.financial.balanceSheet.items.some(i => i.productType === L.RepurchaseAgreements)).toBe(false);\n"""
          insert = """    expect(initialState.financial.balanceSheet.items.some(i => i.productType === L.RepurchaseAgreements)).toBe(false);\n    expect(initialState.financial.balanceSheet.items.some(i => i.productType === L.RetailTransactionalDeposits)).toBe(false);\n    expect(balance(initialState, L.RetailSavingsDeposits)).toBe(7.0e9);\n    expect(initialState.financial.balanceSheet.items.find(i => i.productType === L.RetailSavingsDeposits)?.label).toBe('Instant retail');\n"""
          if needle not in t:
              raise SystemExit('small retail opening assertion anchor not found')
          t = t.replace(needle, insert, 1)
          needle2 = """    expect(out.financial.balanceSheet.items.some(i => i.productType === L.WholesaleFundingST)).toBe(false);\n"""
          insert2 = """    expect(out.financial.balanceSheet.items.some(i => i.productType === L.WholesaleFundingST)).toBe(false);\n    expect(out.financial.balanceSheet.items.some(i => i.productType === L.RetailTransactionalDeposits)).toBe(false);\n"""
          t = t.replace(needle2, insert2, 1)
          test.write_text(t)

          # README funding list: current accounts are no longer a separate opening product.
          r = Path('README.md')
          rt = r.read_text().replace('- retail current accounts\n- instant retail\n', '- instant retail\n')
          r.write_text(rt)
          PY

      - name: Validate naming
        run: |
          ! grep -Rni --include='*.ts' --include='*.tsx' --include='*.md' 'instant-access savings' src README.md docs player_guide.md 2>/dev/null
          ! grep -n 'Retail Current Accounts' src/config/initialState.ts
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs README.md player_guide.md mechanics_exposure_plan.md "BankSim Notes.md"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Consolidate retail deposits into Instant retail"
            git push origin HEAD:consolidate-instant-retail
          fi
