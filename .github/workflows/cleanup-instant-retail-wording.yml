name: Clean Instant retail wording

on:
  push:
    branches: [consolidate-instant-retail]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidate-instant-retail
      - name: Remove stale current-account wording
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/content/mechanicsRegistry.ts')
          s = p.read_text().replace(
              "'Current accounts are separate. The game treats them as less sensitive to price.',",
              "'Instant retail balances respond to the price gap, franchise strength, and reputation.',"
          )
          p.write_text(s)

          p = Path('src/domain/productMeta.ts')
          s = p.read_text().replace(
              "label: 'Retail current accounts'",
              "label: 'Retail transactional deposits (legacy)'"
          )
          p.write_text(s)
          PY
          if grep -Rni --include='*.ts' --include='*.tsx' --include='*.md' -E 'current accounts?|instant[- ]access savings' src README.md docs player_guide.md 2>/dev/null; then
            echo 'Stale product wording remains' >&2
            exit 1
          fi
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Remove stale current-account wording"
          git push origin HEAD:consolidate-instant-retail
