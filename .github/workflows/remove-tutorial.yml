name: Remove tutorial feature

on:
  push:
    branches:
      - remove-tutorial-feature
    paths:
      - .github/scripts/remove_tutorial.py
      - .github/workflows/remove-tutorial.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-tutorial-feature
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove tutorial source
        run: python .github/scripts/remove_tutorial.py
      - name: Verify tutorial production code is gone
        run: |
          if grep -Rni --exclude-dir=node_modules --exclude='*.map' --exclude='managementSurface.test.tsx' 'tutorial' src; then
            echo 'Tutorial references remain under production source'
            exit 1
          fi
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Remove tutorial feature"
          git push origin HEAD:remove-tutorial-feature
