name: Dependency audit diagnostics

on:
  push:
    branches: [security/dependency-audit-2026-09-12]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-audit-diagnostics.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Collect npm audit reports
        run: |
          npm audit --json > audit-all.json || true
          npm audit --omit=dev --json > audit-prod.json || true
      - name: Print high and critical findings
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const [label, file] of [['ALL', 'audit-all.json'], ['PRODUCTION', 'audit-prod.json']]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(`\n=== ${label} DEPENDENCIES ===`);
            console.log('metadata:', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            const vulns = Object.values(report.vulnerabilities ?? {})
              .filter(v => ['high', 'critical'].includes(v.severity))
              .sort((a, b) => (a.severity === 'critical' ? -1 : 1) - (b.severity === 'critical' ? -1 : 1));
            if (!vulns.length) {
              console.log('No high or critical vulnerabilities.');
              continue;
            }
            for (const v of vulns) {
              console.log(`\n${v.name} | ${v.severity} | direct=${v.isDirect} | range=${v.range}`);
              console.log('nodes:', (v.nodes ?? []).join(', '));
              console.log('effects:', (v.effects ?? []).join(', '));
              console.log('fixAvailable:', JSON.stringify(v.fixAvailable));
              for (const via of v.via ?? []) {
                if (typeof via === 'string') console.log('via:', via);
                else console.log(`via: ${via.title} | ${via.severity} | ${via.url} | range=${via.range}`);
              }
            }
          }
          NODE
