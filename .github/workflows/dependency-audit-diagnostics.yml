name: Dependency security upgrade

on:
  push:
    branches: [security/dependency-audit-2026-09-12]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-audit-diagnostics.yml

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-audit-2026-09-12
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - name: Upgrade vulnerable build and test toolchain
        run: npm install --save-dev vite@8.3.0 vitest@4.1.11 @vitejs/plugin-react@6.1.1
      - name: Show resolved security-sensitive packages
        run: npm ls vite vitest @vitejs/plugin-react browserslist nanoid postcss rollup || true
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run full test suite
        run: npm run test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit verified dependency upgrade
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Dependency files already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Upgrade vulnerable Vite and Vitest dependencies'
          git push origin HEAD:security/dependency-audit-2026-09-12
