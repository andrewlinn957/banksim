name: Dependency security upgrade

on:
  push:
    branches: [security/dependency-audit-2026-09-12]
    paths:
      - package.json
      - package-lock.json
      - src/engine/modelRegression.test.ts
      - src/engine/passiveBankCalibration.test.ts
      - src/engine/threeYearPlanRegression.test.ts
      - src/engine/integratedCalibration.test.ts
      - .github/workflows/dependency-audit-diagnostics.yml

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-audit-2026-09-12
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - name: Upgrade vulnerable build and test toolchain
        run: npm install --save-dev vite@8.3.0 vitest@4.1.11 @vitejs/plugin-react@6.1.1
      - name: Make intentional long-test timeouts explicit
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'src/engine/modelRegression.test.ts': (
                  "describe('Model regression harness', () => {",
                  "describe('Model regression harness', { timeout: 30_000 }, () => {",
              ),
              'src/engine/passiveBankCalibration.test.ts': (
                  "describe('Passive bank calibration diagnostics', () => {",
                  "describe('Passive bank calibration diagnostics', { timeout: 30_000 }, () => {",
              ),
              'src/engine/threeYearPlanRegression.test.ts': (
                  "describe('Three-Year Plan calibrated strategy regression',()=>{",
                  "describe('Three-Year Plan calibrated strategy regression', { timeout: 30_000 },()=>{",
              ),
              'src/engine/integratedCalibration.test.ts': (
                  "describe('integrated 72-month game calibration', () => {",
                  "describe('integrated 72-month game calibration', { timeout: 360_000 }, () => {",
              ),
          }

          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one timeout target in {filename}')
              path.write_text(text.replace(old, new))
          PY
      - name: Show resolved security-sensitive packages
        run: npm ls vite vitest @vitejs/plugin-react browserslist nanoid postcss rollup || true
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run full test suite
        run: npm run test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit verified dependency upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json \
            src/engine/modelRegression.test.ts \
            src/engine/passiveBankCalibration.test.ts \
            src/engine/threeYearPlanRegression.test.ts \
            src/engine/integratedCalibration.test.ts
          if git diff --cached --quiet; then
            echo 'Dependency and compatibility files already up to date.'
            exit 0
          fi
          git commit -m 'Upgrade vulnerable Vite and Vitest dependencies'
          git push origin HEAD:security/dependency-audit-2026-09-12
