name: Fix funding maturity ordering

on:
  push:
    branches:
      - fix/funding-maturity-ordering

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/funding-maturity-ordering
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/fix_funding_maturity_ordering.py
      - run: npm ci
      - run: npm run test:fast
      - run: npm run test:regression
      - run: npm run typecheck && npm run build
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine/simulation.ts src/engine/fundingLadder.test.ts
          git commit -m "Fix funding maturity ordering"
          git push
