name: Apply loan market patch

on:
  push:
    branches:
      - rebalance-long-run-dynamics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebalance-long-run-dynamics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply addressable market model
        run: |
          node <<'NODE'
          const fs = require('fs');

          const replaceOnce = (path, before, after) => {
            const text = fs.readFileSync(path, 'utf8');
            if (!text.includes(before)) {
              throw new Error(`Expected snippet not found in ${path}: ${before.slice(0, 120)}`);
            }
            fs.writeFileSync(path, text.replace(before, after));
          };

          replaceOnce(
            'src/domain/config.ts',
            `export interface LoanPipelineParameters {\n  baseDemandRateMonthly: number;\n  pricingSensitivity: number;\n  macroSensitivity: number;\n  baseApprovalRate: number;\n  underwritingSensitivity: number;\n  drawdownRateMonthly: number;\n  cancellationRateMonthly: number;\n}`,
            `export interface LoanPipelineParameters {\n  baseDemandRateMonthly: number;\n  pricingSensitivity: number;\n  macroSensitivity: number;\n  baseApprovalRate: number;\n  underwritingSensitivity: number;\n  drawdownRateMonthly: number;\n  cancellationRateMonthly: number;\n  /** External market stock available to this product before macro scaling. */\n  referenceMarketSize?: number;\n  /** Bank share of the reference market at neutral pricing and underwriting. */\n  referenceBankShare?: number;\n  neutralGdpGrowthMonthly?: number;\n  neutralUnemploymentRate?: number;\n  neutralBorrowerRate?: number;\n  neutralCreditSpread?: number;\n  gdpMarketSensitivity?: number;\n  unemploymentMarketSensitivity?: number;\n  borrowingCostMarketSensitivity?: number;\n  creditSpreadMarketSensitivity?: number;\n  minAddressableMarketMultiplier?: number;\n  maxAddressableMarketMultiplier?: number;\n}`
          );

          replaceOnce(
            'src/config/baseConfig.ts',
            `    loan: {\n      defaultTermMonths: 60,\n      maxTermMonths: 420,`,
            `    loan: {\n      defaultTermMonths: 84,\n      maxTermMonths: 420,`
          );

          replaceOnce(
            'src/config/baseConfig.ts',
            `    [AssetProductType.Mortgages]: {\n      baseDemandRateMonthly: 0.0105,\n      pricingSensitivity: 30,\n      macroSensitivity: 1.2,\n      baseApprovalRate: 0.82,\n      underwritingSensitivity: 0.5,\n      drawdownRateMonthly: 0.5,\n      cancellationRateMonthly: 0.08,\n    },`,
            `    [AssetProductType.Mortgages]: {\n      baseDemandRateMonthly: 0.0105,\n      pricingSensitivity: 30,\n      macroSensitivity: 1.2,\n      baseApprovalRate: 0.82,\n      underwritingSensitivity: 0.5,\n      drawdownRateMonthly: 0.5,\n      cancellationRateMonthly: 0.08,\n      // Rough UK mortgage stock with an opening bank share calibrated to the £5.1bn book.\n      referenceMarketSize: 1.7e12,\n      referenceBankShare: 0.00303,\n      neutralGdpGrowthMonthly: 0.0015,\n      neutralUnemploymentRate: 0.045,\n      neutralBorrowerRate: 0.05,\n      neutralCreditSpread: 0.012,\n      gdpMarketSensitivity: 35,\n      unemploymentMarketSensitivity: 3,\n      borrowingCostMarketSensitivity: 4,\n      creditSpreadMarketSensitivity: 2,\n      minAddressableMarketMultiplier: 0.55,\n      maxAddressableMarketMultiplier: 1.45,\n    },`
          );

          replaceOnce(
            'src/config/baseConfig.ts',
            `    [AssetProductType.CorporateLoans]: {\n      baseDemandRateMonthly: 0.017,\n      pricingSensitivity: 25,\n      macroSensitivity: 1.8,\n      baseApprovalRate: 0.72,\n      underwritingSensitivity: 0.65,\n      drawdownRateMonthly: 0.55,\n      cancellationRateMonthly: 0.1,\n    },`,
            `    [AssetProductType.CorporateLoans]: {\n      baseDemandRateMonthly: 0.017,\n      pricingSensitivity: 25,\n      macroSensitivity: 1.8,\n      baseApprovalRate: 0.72,\n      underwritingSensitivity: 0.65,\n      drawdownRateMonthly: 0.55,\n      cancellationRateMonthly: 0.1,\n      // Broad UK corporate credit pool; share is calibrated to the opening £3.9bn book.\n      referenceMarketSize: 450e9,\n      referenceBankShare: 0.0086,\n      neutralGdpGrowthMonthly: 0.0015,\n      neutralUnemploymentRate: 0.045,\n      neutralBorrowerRate: 0.058,\n      neutralCreditSpread: 0.012,\n      gdpMarketSensitivity: 60,\n      unemploymentMarketSensitivity: 4,\n      borrowingCostMarketSensitivity: 5,\n      creditSpreadMarketSensitivity: 8,\n      minAddressableMarketMultiplier: 0.45,\n      maxAddressableMarketMultiplier: 1.6,\n    },`
          );

          replaceOnce(
            'src/engine/simulation.ts',
            `        const macroSignal =\n          state.market.gdpGrowthMoM -\n          0.6 * Math.max(0, state.market.unemploymentRate - 0.05) -\n          0.4 * Math.max(0, state.market.creditSpread - 0.01);\n        const demandScalar = Math.max(\n          0,\n          1 + pipelineParams.pricingSensitivity * pricingGap + pipelineParams.macroSensitivity * macroSignal\n        );\n        const demand = Math.max(0, item.balance) * pipelineParams.baseDemandRateMonthly * dtMonths * demandScalar;`,
            `        // Demand comes from an external addressable market rather than the bank's current book.\n        // This prevents a shrinking portfolio from mechanically destroying its own future origination pool.\n        const referenceMarketSize = Math.max(\n          0,\n          pipelineParams.referenceMarketSize ?? Math.max(0, item.balance)\n        );\n        const referenceBankShare = clamp(pipelineParams.referenceBankShare ?? 1, 0, 1);\n        const neutralGdp = pipelineParams.neutralGdpGrowthMonthly ?? 0.0015;\n        const neutralUnemployment = pipelineParams.neutralUnemploymentRate ?? 0.045;\n        const neutralBorrowerRate = pipelineParams.neutralBorrowerRate ?? benchmark;\n        const neutralCreditSpread = pipelineParams.neutralCreditSpread ?? 0.012;\n        const macroMarketMultiplier = clamp(\n          1 +\n            (pipelineParams.gdpMarketSensitivity ?? pipelineParams.macroSensitivity) *\n              (state.market.gdpGrowthMoM - neutralGdp) -\n            (pipelineParams.unemploymentMarketSensitivity ?? 0) *\n              (state.market.unemploymentRate - neutralUnemployment) -\n            (pipelineParams.borrowingCostMarketSensitivity ?? 0) *\n              (benchmark - neutralBorrowerRate) -\n            (pipelineParams.creditSpreadMarketSensitivity ?? 0) *\n              (state.market.creditSpread - neutralCreditSpread),\n          pipelineParams.minAddressableMarketMultiplier ?? 0.5,\n          pipelineParams.maxAddressableMarketMultiplier ?? 1.5\n        );\n        const addressableMarket = referenceMarketSize * macroMarketMultiplier;\n        const neutralBankOpportunity = addressableMarket * referenceBankShare;\n        const pricingCapture = clamp(1 + pipelineParams.pricingSensitivity * pricingGap, 0.2, 2.5);\n        const demand =\n          neutralBankOpportunity * pipelineParams.baseDemandRateMonthly * dtMonths * pricingCapture;`
          );

          fs.writeFileSync(
            'src/engine/addressableLoanDemand.test.ts',
            `import { describe, expect, it } from 'vitest';\nimport { baseConfig } from '../config/baseConfig';\nimport { initialState } from '../config/initialState';\nimport { AssetProductType } from '../domain/enums';\nimport { cloneBankState } from './clone';\nimport { applyLoanBehaviour } from './simulation';\n\nconst item = (state: typeof initialState, product: AssetProductType) =>\n  state.financial.balanceSheet.items.find((row) => row.productType === product)!;\n\ndescribe('Addressable loan demand', () => {\n  it('does not collapse just because the bank current corporate book is smaller', () => {\n    const full = cloneBankState(initialState);\n    const small = cloneBankState(initialState);\n    item(small, AssetProductType.CorporateLoans).balance *= 0.2;\n\n    const fullResult = applyLoanBehaviour(full, structuredClone(baseConfig), 1, []);\n    const smallResult = applyLoanBehaviour(small, structuredClone(baseConfig), 1, []);\n\n    const fullDemand = full.loanPipelines?.[AssetProductType.CorporateLoans]?.demandNotional ?? 0;\n    const smallDemand = small.loanPipelines?.[AssetProductType.CorporateLoans]?.demandNotional ?? 0;\n    expect(fullResult.demandNotional).toBeGreaterThan(0);\n    expect(smallResult.demandNotional).toBeGreaterThan(0);\n    expect(smallDemand / fullDemand).toBeGreaterThan(0.95);\n  });\n\n  it('contracts the opportunity in a weak macro environment', () => {\n    const normal = cloneBankState(initialState);\n    const weak = cloneBankState(initialState);\n    weak.market.gdpGrowthMoM = -0.006;\n    weak.market.unemploymentRate = 0.08;\n    weak.market.creditSpread = 0.035;\n    weak.market.competitorMortgageRate += 0.02;\n    weak.market.corporateLoanSpread += 0.02;\n\n    applyLoanBehaviour(normal, structuredClone(baseConfig), 1, []);\n    applyLoanBehaviour(weak, structuredClone(baseConfig), 1, []);\n\n    const normalMortgage = normal.loanPipelines?.[AssetProductType.Mortgages]?.demandNotional ?? 0;\n    const weakMortgage = weak.loanPipelines?.[AssetProductType.Mortgages]?.demandNotional ?? 0;\n    const normalCorporate = normal.loanPipelines?.[AssetProductType.CorporateLoans]?.demandNotional ?? 0;\n    const weakCorporate = weak.loanPipelines?.[AssetProductType.CorporateLoans]?.demandNotional ?? 0;\n    expect(weakMortgage).toBeLessThan(normalMortgage);\n    expect(weakCorporate).toBeLessThan(normalCorporate);\n  });\n});\n`
          );

          fs.unlinkSync('.github/workflows/agent-loan-market-patch.yml');
          NODE
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use macro addressable markets for loan demand"
          git push origin HEAD:rebalance-long-run-dynamics
