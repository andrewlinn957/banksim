name: PR5 catalogue migration

on:
  push:
    branches:
      - refactor/config-ui-cleanup

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/config-ui-cleanup
          fetch-depth: 0
      - name: Make benchmark and loan UI selection catalogue-backed
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          simulation = Path('src/engine/simulation.ts')
          text = simulation.read_text()
          catalogue_import = "import { PRODUCTS } from '../products/catalogue';"
          benchmark_import = "import { customerDepositProductsForBenchmark, requireLoanProductForBenchmark } from '../products/benchmarks';"
          if benchmark_import not in text:
              text = text.replace(catalogue_import, catalogue_import + "\n" + benchmark_import)

          old_groups = """const RETAIL_DEPOSIT_PRODUCTS: LiabilityProductType[] = [
            LiabilityProductType.RetailCurrentAccounts,
          ];

          const CORPORATE_DEPOSIT_PRODUCTS: LiabilityProductType[] = [
            LiabilityProductType.CorporateOperatingDeposits,
            LiabilityProductType.CorporateNonOperatingDeposits,
          ];"""
          new_groups = """const RETAIL_DEPOSIT_PRODUCTS = customerDepositProductsForBenchmark('retailCurrentAccount');
          const CORPORATE_DEPOSIT_PRODUCTS = customerDepositProductsForBenchmark('corporateDeposit');
          const MORTGAGE_BENCHMARK_PRODUCT = requireLoanProductForBenchmark('mortgage');
          const CORPORATE_LOAN_BENCHMARK_PRODUCT = requireLoanProductForBenchmark('corporate');"""
          if old_groups not in text:
              raise SystemExit('Expected deposit benchmark group block not found')
          text = text.replace(old_groups, new_groups)
          text = text.replace(
              'const weightedOfferedRate = (state: BankState, products: LiabilityProductType[]): number => {',
              'const weightedOfferedRate = (state: BankState, products: readonly ProductType[]): number => {'
          )
          text = text.replace(
              'products.includes(item.productType as LiabilityProductType)',
              'products.includes(item.productType)'
          )
          text, mortgage_count = re.subn(
              r'(const mortgageTarget\s*=\s*\n\s*)findItem\(state\.financial\.balanceSheet, AssetProductType\.Mortgages\)',
              r'\1findItem(state.financial.balanceSheet, MORTGAGE_BENCHMARK_PRODUCT)',
              text,
              count=1,
          )
          if mortgage_count != 1:
              raise SystemExit(f'Expected one mortgage competitor target, migrated {mortgage_count}')
          text, corporate_count = re.subn(
              r'(const corporateLoanRate\s*=\s*\n\s*)findItem\(state\.financial\.balanceSheet, AssetProductType\.CorporateLoans\)',
              r'\1findItem(state.financial.balanceSheet, CORPORATE_LOAN_BENCHMARK_PRODUCT)',
              text,
              count=1,
          )
          if corporate_count != 1:
              raise SystemExit(f'Expected one corporate competitor target, migrated {corporate_count}')
          simulation.write_text(text)

          loans = Path('src/components/LoansPanel.tsx')
          text = loans.read_text()
          formatter_import = "import { formatCurrency, formatRate, formatInt } from '../utils/formatters';"
          additions = """import { getProduct } from '../products/catalogue';
          import { LoanProductType, productTypesWithCapability } from '../products/capabilities';"""
          if "productTypesWithCapability" not in text:
              text = text.replace(formatter_import, formatter_import + "\n" + additions)
          old_portfolios = """const LOAN_PORTFOLIOS = [AssetProductType.Mortgages, AssetProductType.ConsumerLoans, AssetProductType.CorporateLoans] as const;
          type LoanPortfolioType = (typeof LOAN_PORTFOLIOS)[number];

          const PORTFOLIO_LABEL: Record<LoanPortfolioType, string> = {
            [AssetProductType.Mortgages]: 'Residential mortgages',
            [AssetProductType.ConsumerLoans]: 'Personal loans & revolving credit',
            [AssetProductType.CorporateLoans]: 'SME & business lending',
          };"""
          new_portfolios = """const LOAN_PORTFOLIOS = productTypesWithCapability('loan');
          type LoanPortfolioType = LoanProductType;"""
          if old_portfolios not in text:
              raise SystemExit('Expected loan portfolio UI block not found')
          text = text.replace(old_portfolios, new_portfolios)
          text, label_count = re.subn(r'PORTFOLIO_LABEL\[([^\]]+)\]', r'getProduct(\1).label', text)
          if label_count == 0 or 'PORTFOLIO_LABEL' in text:
              raise SystemExit('Loan portfolio labels were not fully migrated')
          loans.write_text(text)
          print(f'Migrated benchmark targets and {label_count} loan UI label reads')
          PY
      - name: Remove temporary migration workflow and commit
        run: |
          rm .github/workflows/pr5-catalogue-migrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/simulation.ts src/components/LoansPanel.tsx .github/workflows/pr5-catalogue-migrate.yml
          git commit -m "Make benchmark and loan UI selection catalogue-backed"
          git push origin HEAD:refactor/config-ui-cleanup
