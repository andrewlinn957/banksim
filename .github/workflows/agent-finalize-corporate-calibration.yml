name: Finalize corporate demand calibration

on:
  push:
    branches:
      - rebalance-long-run-dynamics

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebalance-long-run-dynamics
          fetch-depth: 0
      - name: Apply final calibration and remove temporary probes
        run: |
          python - <<'PY'
          from pathlib import Path

          base = Path('src/config/baseConfig.ts')
          text = base.read_text()
          old = """    [AssetProductType.CorporateLoans]: {
      baseDemandRateMonthly: 0.017,
"""
          new = """    [AssetProductType.CorporateLoans]: {
      // Calibrated so a competitively priced seven-year corporate book broadly replaces structural runoff.
      baseDemandRateMonthly: 0.05,
"""
          if old not in text:
            raise SystemExit('Corporate base demand calibration marker missing')
          base.write_text(text.replace(old, new, 1))

          regression = Path('src/engine/modelRegression.test.ts')
          text = regression.read_text()
          old_open = """    const openingLoans = totalLoans(initialState);
    const openingDeposits = totalCustomerDeposits(initialState);
"""
          new_open = """    const openingLoans = totalLoans(initialState);
    const openingCorporateLoans = productBalance(initialState, AssetProductType.CorporateLoans);
    const openingDeposits = totalCustomerDeposits(initialState);
"""
          if old_open not in text:
            raise SystemExit('Opening loan marker missing')
          text = text.replace(old_open, new_open, 1)

          old_final = """    const finalLoans = totalLoans(finalState);
    const finalDeposits = totalCustomerDeposits(finalState);
"""
          new_final = """    const finalLoans = totalLoans(finalState);
    const finalCorporateLoans = productBalance(finalState, AssetProductType.CorporateLoans);
    const finalDeposits = totalCustomerDeposits(finalState);
"""
          if old_final not in text:
            raise SystemExit('Final loan marker missing')
          text = text.replace(old_final, new_final, 1)

          old_assert = """    expect(finalLoans).toBeGreaterThan(openingLoans * 0.65);
    expect(finalLoans).toBeLessThan(openingLoans * 2);
"""
          new_assert = """    expect(finalLoans).toBeGreaterThan(openingLoans * 0.65);
    expect(finalLoans).toBeLessThan(openingLoans * 2);
    expect(finalCorporateLoans).toBeGreaterThan(openingCorporateLoans * 0.7);
    expect(finalCorporateLoans).toBeLessThan(openingCorporateLoans * 1.3);
"""
          if old_assert not in text:
            raise SystemExit('Long-run loan assertion marker missing')
          regression.write_text(text.replace(old_assert, new_assert, 1))

          for temporary in [
              Path('src/engine/corporateDemandSweep.test.ts'),
              Path('src/engine/finalRunThrough.test.ts'),
              Path('.github/workflows/agent-finalize-corporate-calibration.yml'),
          ]:
            if temporary.exists():
              temporary.unlink()
          PY
      - name: Commit final model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize corporate loan demand calibration"
          git push origin HEAD:rebalance-long-run-dynamics
