name: Generate official ITL1 map

on:
  push:
    branches:
      - fix/official-itl1-map-oprisk-card
    paths:
      - .github/workflows/generate-official-itl1-map.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/official-itl1-map-oprisk-card
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SVG paths from ONS ITL1 boundary layer
        run: |
          python - <<'PY'
          import json
          import math
          import urllib.parse
          import urllib.request
          from pathlib import Path

          service = 'https://services1.arcgis.com/ESMARspQHYMw9BZ9/arcgis/rest/services/ITL1_JAN_2025_UK_BUC/FeatureServer/0/query'
          params = {
              'where': '1=1',
              'outFields': 'ITL125CD,ITL125NM',
              'returnGeometry': 'true',
              'outSR': '27700',
              'f': 'json',
          }
          with urllib.request.urlopen(service + '?' + urllib.parse.urlencode(params), timeout=60) as response:
              payload = json.load(response)

          if 'features' not in payload:
              raise RuntimeError(payload)

          name_to_key = {
              'North East (England)': 'northEast',
              'North West (England)': 'northWest',
              'Yorkshire and The Humber': 'yorkshireAndTheHumber',
              'East Midlands (England)': 'eastMidlands',
              'West Midlands (England)': 'westMidlands',
              'East (England)': 'eastOfEngland',
              'London': 'london',
              'South East (England)': 'southEast',
              'South West (England)': 'southWest',
              'Wales': 'wales',
              'Scotland': 'scotland',
              'Northern Ireland': 'northernIreland',
          }

          features = {}
          points = []
          for feature in payload['features']:
              name = feature['attributes']['ITL125NM']
              key = name_to_key.get(name)
              if not key:
                  raise RuntimeError(f'Unexpected ITL1 region: {name}')
              rings = feature.get('geometry', {}).get('rings', [])
              if not rings:
                  raise RuntimeError(f'No geometry for {name}')
              features[key] = rings
              points.extend(point for ring in rings for point in ring)

          if len(features) != 12:
              raise RuntimeError(f'Expected 12 ITL1 features, got {len(features)}')

          xmin = min(p[0] for p in points)
          xmax = max(p[0] for p in points)
          ymin = min(p[1] for p in points)
          ymax = max(p[1] for p in points)
          width, height, padding = 360.0, 600.0, 10.0
          scale = min((width - 2 * padding) / (xmax - xmin), (height - 2 * padding) / (ymax - ymin))
          map_w = (xmax - xmin) * scale
          map_h = (ymax - ymin) * scale
          x0 = (width - map_w) / 2
          y0 = (height - map_h) / 2

          def screen(point):
              x, y = point
              return (x0 + (x - xmin) * scale, height - y0 - (y - ymin) * scale)

          def distance_to_segment(p, a, b):
              px, py = p; ax, ay = a; bx, by = b
              dx, dy = bx - ax, by - ay
              if dx == 0 and dy == 0:
                  return math.hypot(px - ax, py - ay)
              t = max(0.0, min(1.0, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy)))
              qx, qy = ax + t * dx, ay + t * dy
              return math.hypot(px - qx, py - qy)

          def rdp(points, epsilon):
              if len(points) <= 2:
                  return points
              a, b = points[0], points[-1]
              max_dist = -1.0
              index = 0
              for i in range(1, len(points) - 1):
                  dist = distance_to_segment(points[i], a, b)
                  if dist > max_dist:
                      index, max_dist = i, dist
              if max_dist > epsilon:
                  left = rdp(points[:index + 1], epsilon)
                  right = rdp(points[index:], epsilon)
                  return left[:-1] + right
              return [a, b]

          def ring_path(ring):
              projected = [screen(p) for p in ring]
              if projected[0] == projected[-1]:
                  core = projected[:-1]
              else:
                  core = projected
              if len(core) >= 3:
                  # Simplify each closed boundary to roughly one quarter SVG pixel while
                  # retaining the official ONS shape rather than hand-drawn polygons.
                  simplified = rdp(core + [core[0]], 0.22)
                  core = simplified[:-1] if simplified[-1] == simplified[0] else simplified
              coords = ' L'.join(f'{x:.1f} {y:.1f}' for x, y in core)
              return f'M{coords} Z'

          order = [
              'northEast', 'northWest', 'yorkshireAndTheHumber', 'eastMidlands',
              'westMidlands', 'eastOfEngland', 'london', 'southEast', 'southWest',
              'scotland', 'wales', 'northernIreland'
          ]
          paths = {key: ' '.join(ring_path(ring) for ring in features[key]) for key in order}

          lines = [
              "import { UkItl1Region } from './ukItl1';",
              '',
              '/**',
              ' * Official ONS International Territorial Level 1 (January 2025) boundaries, UK BUC.',
              ' * Boundary source is published by ONS as a shapefile and ArcGIS Feature Service.',
              ' * The coordinates below are projected into a fixed SVG viewBox at build time so',
              ' * BankSim stays dependency-free and does not fetch map data at runtime.',
              ' * Source: Office for National Statistics licensed under the Open Government Licence v3.0.',
              ' * Contains OS data © Crown copyright and database right 2025.',
              ' */',
              "export const UK_ITL1_MAP_VIEWBOX = '0 0 360 600';",
              '',
              'export const UK_ITL1_MAP_PATHS: Record<UkItl1Region, string> = {',
          ]
          for key in order:
              lines.append(f"  {key}: {json.dumps(paths[key])},")
          lines.append('};')
          lines.append('')

          Path('src/domain/ukItl1MapPaths.ts').write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Commit generated map paths
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/domain/ukItl1MapPaths.ts
          git diff --cached --quiet && exit 0
          git commit -m "Add official ONS ITL1 map geometry"
          git push origin HEAD:fix/official-itl1-map-oprisk-card
