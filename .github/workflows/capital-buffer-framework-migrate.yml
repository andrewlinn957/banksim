name: Capital buffer migration

on:
  push:
    branches:
      - feature/capital-buffer-framework

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/capital-buffer-framework
      - name: Apply migration
        run: python .github/scripts/capital_buffer_migrate.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement UK capital buffer framework"
          git push origin HEAD:feature/capital-buffer-framework
