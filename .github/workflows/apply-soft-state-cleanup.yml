name: Apply soft-state cleanup

on:
  push:
    branches:
      - cleanup/remove-low-value-soft-state

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-low-value-soft-state
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch cleanup script for current source layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/remove_low_value_soft_state.py')
          s=p.read_text()
          old='''    r"  conductRisk: \\{.*?\\n  \\},\\n  sharePriceModel:",\n    "  sharePriceModel:",'''
          new='''    r"  conductRisk: \\{.*?\\n  \\},\\n  boeFunding:",\n    "  boeFunding:",'''
          if old not in s:
              raise SystemExit('Expected conduct-risk cleanup pattern not found')
          s=s.replace(old,new)
          for redundant in [
              '        "    conductEventCooldownMonths: 0,",\n',
              '        "    conductEventCount: 0,",\n',
              '        "    cumulativeConductCosts: 0,",\n',
          ]:
              if redundant not in s:
                  raise SystemExit(f'Expected redundant cleanup needle not found: {redundant!r}')
              s=s.replace(redundant,'')
          old_raise='''    if expected is not None and count != expected:\n        raise RuntimeError(f"{path}: expected {expected} regex matches, found {count}: {pattern[:100]!r}")\n    write(path, updated)'''
          new_raise='''    if expected is not None and count != expected:\n        # Board-pressure field lines are removed globally before the now-empty destructuring block is reached.\n        already_removed_board_destructure = (\n            path == "src/engine/metrics.ts"\n            and count == 0\n            and "boardPressureScore" in pattern\n            and "computeBoardPressureMetrics" in pattern\n        )\n        if not already_removed_board_destructure:\n            raise RuntimeError(f"{path}: expected {expected} regex matches, found {count}: {pattern[:100]!r}")\n    write(path, updated)'''
          if old_raise not in s:
              raise SystemExit('Expected sub() assertion block not found')
          s=s.replace(old_raise,new_raise)
          marker='\n# --- Final source-level guard'
          if marker not in s:
              raise SystemExit('Final guard marker not found')
          addition='''\n# Remove residual Board Pressure plumbing after its individual fields are stripped.\nsub(\n    "src/config/scenarios.ts",\n    r"  if \\(override\\?\\.board\\) \\{.*?\\n  \\}\\n",\n)\nsub(\n    "src/engine/metrics.ts",\n    r"  const \\{\\n  \\} = computeBoardPressureMetrics\\(state, config\\.riskLimits, config, cet1Headroom, maxPayoutRatio\\);\\n",\n)\nremove_lines(\n    "src/engine/clone.ts",\n    ["  board: { ...state.board },"],\n)\n'''
          s=s.replace(marker,addition+marker)
          p.write_text(s)
          PY
      - name: Apply cleanup
        run: python3 scripts/remove_low_value_soft_state.py
      - name: Fix generated help copy and test fallout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Generated help copy: use double quotes around the apostrophe.
          p=Path('src/content/mechanicsRegistry.ts')
          s=p.read_text()
          bad="      'Management chooses the bank's internal prudential targets.',"
          good='      "Management chooses the bank\'s internal prudential targets.",'
          if bad not in s:
              raise SystemExit('Expected generated risk-appetite help line not found')
          p.write_text(s.replace(bad,good))

          # Removed mechanics are no longer valid contextual-help anchors.
          p=Path('src/content/mechanicsRegistry.test.ts')
          s=p.read_text()
          for line in ["      'conduct-risk',\n", "      'board-pressure',\n"]:
              if line not in s:
                  raise SystemExit(f'Expected obsolete mechanics-registry anchor not found: {line!r}')
              s=s.replace(line,'')
          p.write_text(s)

          # closeCapital no longer accepts the removed conduct-cost argument.
          for filename in ['src/engine/costModel.test.ts','src/engine/loanCohorts.test.ts']:
              p=Path(filename)
              s=p.read_text()
              old=s
              s=s.replace('    defaultedPrincipal,\n    0,\n    []\n', '    defaultedPrincipal,\n    []\n')
              s=s.replace('      cohortRes.defaultedPrincipal,\n      0,\n      []\n', '      cohortRes.defaultedPrincipal,\n      []\n')
              if s == old:
                  raise SystemExit(f'Expected closeCapital conduct-cost test argument not found in {filename}')
              p.write_text(s)

          # The internal-target test now isolates the two retained dynamic channels:
          # funding stress and the funding-confidence state.
          p=Path('src/engine/internalCapitalTarget.test.ts')
          s=p.read_text()
          anchor='    const config = structuredClone(baseConfig);\n'
          if anchor not in s:
              raise SystemExit('Internal-capital-target config anchor not found')
          s=s.replace(anchor, anchor +
              '    config.riskLimits.capitalPolicy.internalTargetStressSensitivity = .02;\n' +
              '    config.riskLimits.capitalPolicy.internalTargetConfidenceSensitivity = .015;\n')
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run typecheck && npm run build
      - name: Fast tests
        run: npm run test:fast
      - name: Regression tests
        run: npm run test:regression
      - name: Show remaining related references
        run: |
          git grep -n -E 'BoardPressure|boardPressure|conductRisk|ConductRisk|conductEvent|conductCosts|cumulativeConductCosts|reputationRunoffSensitivity|internalTargetConductSensitivity|internalTargetVolatilitySensitivity|earningsVolatility|previousNetIncome|behaviour\.reputation|state\.board|\.board\.score' -- src || true
      - name: Commit verified cleanup
        if: success()
        shell: bash
        run: |
          rm -f scripts/remove_low_value_soft_state.py
          rm -f .github/workflows/audit-soft-state.yml
          rm -f .github/workflows/apply-soft-state-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove low-value conduct and board-pressure mechanics'
          git push origin HEAD:cleanup/remove-low-value-soft-state
