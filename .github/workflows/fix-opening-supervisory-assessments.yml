name: Fix opening supervisory assessments

on:
  push:
    branches:
      - fix/opening-supervisory-assessments

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/opening-supervisory-assessments
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/fix_opening_supervisory_assessments.py
      - run: npm ci
      - run: npm run test:fast
      - run: npm run test:regression
      - run: npm run typecheck && npm run build
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/config/scenarios.ts src/config/calibration/utils.ts src/engine/supervisoryAssessments.ts src/config/openingSupervisoryAssessments.test.ts
          git commit -m "Fix opening supervisory assessments"
          git push
