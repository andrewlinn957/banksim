name: Apply ITL1 RWA map patch

on:
  push:
    branches: [feature/itl1-rwa-map]
    paths:
      - '.github/workflows/apply-itl1-rwa-map.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/itl1-rwa-map
      - run: python scripts/apply_itl1_rwa_map.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add ITL1 loan geography and RWA map"
          git push origin HEAD:feature/itl1-rwa-map
