name: Catalogue audit

on:
  push:
    branches: [product-catalogue]

permissions:
  contents: write

jobs:
  codemod:
    if: github.event.head_commit.message != 'Apply product catalogue codemod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace PRODUCT_META with catalogue
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = {
              'src/config/calibration/utils.ts': ('../../domain/productMeta', '../../products/catalogue'),
              'src/engine/metrics.ts': ('../domain/productMeta', '../products/catalogue'),
              'src/engine/prudential.ts': ('../domain/productMeta', '../products/catalogue'),
              'src/engine/loanCohorts.ts': ('../domain/productMeta', '../products/catalogue'),
              'src/engine/simulation.ts': ('../domain/productMeta', '../products/catalogue'),
              'src/game/management.ts': ('../domain/productMeta', '../products/catalogue'),
              'src/game/departments.ts': ('../domain/productMeta', '../products/catalogue'),
          }
          for name, (old_import, new_import) in paths.items():
              path = Path(name)
              text = path.read_text()
              text = text.replace("import { PRODUCT_META } from '" + old_import + "';", "import { PRODUCTS } from '" + new_import + "';")
              text = text.replace('PRODUCT_META', 'PRODUCTS')
              path.write_text(text)

          Path('src/domain/productMeta.ts').unlink()
          PY
      - name: Commit codemod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply product catalogue codemod"
          git push
