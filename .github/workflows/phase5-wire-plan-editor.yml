name: Phase5 wire plan editor

on:
  push:
    branches: [phase5-plan-aware-boardroom]
    paths: [.github/workflows/phase5-wire-plan-editor.yml]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5-plan-aware-boardroom
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Wire opening plan target editing into App
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          s=s.replace(
            "import { BankState } from './domain/bankState';",
            "import { BankState } from './domain/bankState';\nimport type { ThreeYearPlanTarget } from './domain/threeYearPlan';",
            1,
          )
          anchor="""  const totalEquity = useMemo(
"""
          handler="""  const updateThreeYearPlanTargets = (targets: readonly ThreeYearPlanTarget[]) => {
    if (!canConfigureThreeYearPlan || !bankState.threeYearPlan?.enabled) return;
    const nextTargets = targets.map(target => ({
      ...target,
      milestones: target.milestones.map(milestone => ({ ...milestone })),
    }));
    const nextState: BankState = {
      ...bankState,
      threeYearPlan: {
        ...bankState.threeYearPlan,
        targets: nextTargets,
        currentEvaluation: undefined,
        reviewHistory: [],
        lastEvaluationStep: undefined,
        completed: false,
      },
    };
    setBankState(nextState);
    setStateHistory([nextState]);
    setCurrentSnapshots([controller.createSnapshot(nextState)]);
  };

"""
          assert anchor in s, 'Three-Year Plan handler insertion point changed unexpectedly'
          s=s.replace(anchor,handler+anchor,1)
          old="<Boardroom state={bankState} history={stateHistory} department={isActionsOpen?activeDepartment:null} hasErrors={parsedActionForm.hasErrors} onDepartment={openDepartment} onClose={()=>setIsActionsOpen(false)} onDecision={backProposal} selectedDecisions={selectedDecisions}>"
          new="<Boardroom state={bankState} history={stateHistory} department={isActionsOpen?activeDepartment:null} hasErrors={parsedActionForm.hasErrors} onDepartment={openDepartment} onClose={()=>setIsActionsOpen(false)} onDecision={backProposal} selectedDecisions={selectedDecisions} canEditPlan={canConfigureThreeYearPlan && threeYearPlanEnabled} onPlanTargetsChange={updateThreeYearPlanTargets}>"
          assert old in s, 'Boardroom plan-editor wiring point changed unexpectedly'
          p.write_text(s.replace(old,new,1))
          PY
      - run: npm ci
      - run: npx vitest run src/game/boardroom.test.tsx --reporter=verbose
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check
      - name: Commit plan editor wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Wire opening Three-Year Plan targets into app state"
          git push origin HEAD:phase5-plan-aware-boardroom
