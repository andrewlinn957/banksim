name: Phase4 capital markets wiring

on:
  push:
    branches: [phase4-capital-markets-bookbuild]
    paths: [.github/workflows/phase4-wire-capital-markets.yml]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-capital-markets-bookbuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply engine wiring
        run: python scripts/phase4_wire_capital_markets.py
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run src/engine/capitalMarkets.test.ts --reporter=verbose
      - run: git diff --check
      - name: Commit validated engine wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/simulation.ts
          git commit -m "Wire capital-markets bookbuild into simulation"
          git push origin HEAD:phase4-capital-markets-bookbuild
