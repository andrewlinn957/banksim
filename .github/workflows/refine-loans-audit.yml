name: Refine loans audit

on:
  push:
    branches:
      - audit-loans-tab
    paths:
      - .github/scripts/refine_loans_audit.py
      - .github/workflows/refine-loans-audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-loans-tab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/refine_loans_audit.py
      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Refine Loans risk and maturity display"
          git push origin HEAD:audit-loans-tab
