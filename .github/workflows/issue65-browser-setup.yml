name: Issue 65 browser coverage setup

on:
  push:
    branches:
      - test/issue-65-browser-viewports
    paths:
      - tests/e2e/viewport.spec.ts
      - playwright.config.ts
      - .github/workflows/issue65-browser-setup.yml

permissions:
  contents: write

jobs:
  browser-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/issue-65-browser-viewports
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
      - name: Add Playwright dependency and browser test script
        run: |
          npm install --save-dev @playwright/test
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          p.scripts['test:browser'] = 'playwright test';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
      - name: Add browser lane to CI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ci.yml')
          text=p.read_text()
          block='''\n  browser:\n    name: Browser viewport coverage\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '20.20.2'\n          cache: npm\n      - run: npm ci\n      - run: npx playwright install --with-deps chromium\n      - run: npm run test:browser\n'''
          if '\n  browser:\n' not in text:
              text=text.rstrip()+block+'\n'
          p.write_text(text)
          PY
      - name: Fit narrow LCR detail tables
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/styles.css')
          text=p.read_text()
          marker='/* Narrow LCR detail tables stay inside their card instead of widening the page. */'
          if marker not in text:
              text += '''\n\n/* Narrow LCR detail tables stay inside their card instead of widening the page. */\n@media(max-width:760px) {\n  .lcr-dashboard,.lcr-working-grid,.lcr-working-grid>*,.lcr-detail,.lcr-contribution-detail { min-width:0; }\n  .lcr-detail-group { min-width:0; max-width:100%; overflow:hidden; }\n  .lcr-detail-group table { width:100%; table-layout:fixed; }\n  .lcr-detail-group th { width:42%; overflow-wrap:anywhere; }\n  .lcr-detail-group td { width:58%; white-space:normal; overflow-wrap:anywhere; }\n}\n'''
          p.write_text(text)
          PY
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:fast
      - run: npm run typecheck && npm run build
      - name: Commit verified browser coverage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/ci.yml src/styles.css
          git commit -m 'Add browser viewport regression coverage'
          git push origin HEAD:test/issue-65-browser-viewports
