name: Fix Tier 2 effective Tier 1 requirement

on:
  push:
    branches:
      - fix/tier2-effective-tier1-requirement

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tier2-effective-tier1-requirement
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/fix_tier2_effective_tier1.py
      - run: npm ci
      - run: npm run test:fast
      - run: npm run test:regression
      - run: npm run typecheck && npm run build
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine/metrics.ts src/components/CapitalDashboard.tsx src/engine/tier2Requirement.test.ts
          git commit -m "Fix Tier 2 effective Tier 1 requirement"
          git push
