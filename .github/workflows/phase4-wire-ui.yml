name: Phase4 capital markets UI wiring

on:
  push:
    branches: [phase4-capital-markets-bookbuild]
    paths: [.github/workflows/phase4-wire-ui.yml]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-capital-markets-bookbuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply UI wiring
        run: python scripts/phase4_wire_ui.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx vitest run src/engine/capitalMarkets.test.ts src/engine/capitalMarketsIntegration.test.ts src/game/boardroom.test.tsx --reporter=verbose
      - run: git diff --check
      - name: Commit validated UI wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/game/boardroom.ts src/game/boardroom.test.tsx
          git commit -m "Route live issuance through capital-markets bookbuild"
          git push origin HEAD:phase4-capital-markets-bookbuild
# rerun after scenario-form transform fix
