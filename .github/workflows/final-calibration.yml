name: Final calibration patch
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebalance-long-run-dynamics
          fetch-depth: 0
      - name: Patch and clean
        run: |
          sed -i '/\[AssetProductType.CorporateLoans\]: {/,/macroSensitivity:/ { s/baseDemandRateMonthly: 0.05/baseDemandRateMonthly: 0.026/; s/pricingSensitivity: 25/pricingSensitivity: 65/; }' src/config/baseConfig.ts
          sed -i 's/const corporateDiscount = pricing.corporateDiscount ?? 0.006;/const corporateDiscount = pricing.corporateDiscount ?? 0.015;/' src/engine/modelRegression.test.ts
          rm -f src/engine/corporateCaptureSweep.test.ts
          rm -f .github/workflows/agent-apply-final-corporate-calibration.yml
          rm -f .github/workflows/final-calibration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize corporate loan replacement calibration"
          git push origin HEAD:rebalance-long-run-dynamics
