services:
  banksim-api:
    image: banksim-evaluation-api:${BANKSIM_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      BANKSIM_HOST: 0.0.0.0
      BANKSIM_PORT: 3000
      BANKSIM_DATABASE_PATH: /data/banksim.sqlite3
      BANKSIM_ENGINE_VERSION: ${BANKSIM_ENGINE_VERSION:?Set BANKSIM_ENGINE_VERSION in deploy/.env}
      BANKSIM_SCENARIO_VERSION: ${BANKSIM_SCENARIO_VERSION:-public-catalogue-v1}
    ports:
      - 127.0.0.1:${BANKSIM_PORT:-3000}:3000
    volumes:
      - banksim-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  banksim-data:
    name: banksim-evaluation-data
